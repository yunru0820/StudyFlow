<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyFlow</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f7fb;
    margin: 0;
    padding: 30px 15px;
    color: #222;
}

.container {
    max-width: 650px;
    margin: auto;
}

h1 {
    text-align: center;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.08);
}

.task {
    display: block;
    font-size: 18px;
    margin: 15px 0;
}

.progress-bg {
    width: 100%;
    height: 15px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #4CAF50;
    transition: 0.3s;
}

#timer {
    font-size: 42px;
    margin: 20px 0;
}

button {
    padding: 10px 16px;
    margin-right: 6px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>📚 StudyFlow</h1>

<div class="card">

<h2>今日の進捗</h2>

<p>完了タスク：<span id="doneCount">0</span>/4</p >
<p>達成率：<span id="percent">0</span>%</p >

<div class="progress-bg">
    <div id="progressBar"></div>
</div>

<label class="task">
<input type="checkbox" class="taskCheck"> 数学
</label>

<label class="task">
<input type="checkbox" class="taskCheck"> 英語
</label>

<label class="task">
<input type="checkbox" class="taskCheck"> 物理
</label>

<label class="task">
<input type="checkbox" class="taskCheck"> 化学
</label>

</div>


<div class="card">

<h2>⏱ 学習タイマー</h2>

<div id="timer">00:00:00</div>

<button onclick="startTimer()">スタート</button>
<button onclick="pauseTimer()">一時停止</button>
<button onclick="resetTimer()">リセット</button>

</div>

</div>


<script>

const tasks = document.querySelectorAll(".taskCheck");

tasks.forEach(task => {
    task.addEventListener("change", updateProgress);
});

function updateProgress() {

    let done = 0;

    tasks.forEach(task => {
        if(task.checked) done++;
    });

    const percent = done * 25;

    document.getElementById("doneCount").textContent = done;
    document.getElementById("percent").textContent = percent;
    document.getElementById("progressBar").style.width = percent + "%";
}


let seconds = 0;
let timerInterval = null;

function showTime() {

    const h = String(Math.floor(seconds / 3600)).padStart(2,"0");
    const m = String(Math.floor((seconds % 3600) / 60)).padStart(2,"0");
    const s = String(seconds % 60).padStart(2,"0");

    document.getElementById("timer").textContent =
        h + ":" + m + ":" + s;
}

function startTimer() {

    if(timerInterval !== null) return;

    timerInterval = setInterval(() => {
        seconds++;
        showTime();
    },1000);
}

function pauseTimer() {

    clearInterval(timerInterval);
    timerInterval = null;
}

function resetTimer() {

    clearInterval(timerInterval);
    timerInterval = null;

    seconds = 0;
    showTime();
}

</script>

</body>
</html>
